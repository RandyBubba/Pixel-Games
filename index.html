<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Materials</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #8a93a6;
      --accent: #4ea1ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      height: 100%;
      padding: 16px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 500;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .materials { gap: 6px; }
    .mat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1d2230;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .mat:hover { border-color: #3a4254; }
    .mat.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    label { font-size: 13px; color: var(--muted); }
    input[type="range"] { width: 140px; accent-color: var(--accent); }
    button {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1d2230;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { border-color: #3a4254; }
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    canvas {
      background: #05070b;
      border: 1px solid var(--border);
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .hint { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <h1>Pixel Materials</h1>

    <div class="panel materials" id="materials"></div>

    <div class="panel">
      <label for="brush">Brush</label>
      <input type="range" id="brush" min="1" max="20" value="5" />
      <span id="brushValue" class="hint">5</span>
      <button id="clear">Clear</button>
      <span class="hint">Click or drag to paint. Right-click to erase. Pick Ignite, then click TNT to light the fuse.</span>
    </div>

    <div class="stage">
      <canvas id="world" width="240" height="160"></canvas>
    </div>
  </div>

  <script>
  (() => {
    const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, TNT = 4, TNT_LIT = 5;
    const IGNITE_TOOL = -1;

    const MATERIALS = [
      { id: SAND,        name: "Sand",   color: "#d9b26a" },
      { id: WATER,       name: "Water",  color: "#3a8dde" },
      { id: STONE,       name: "Stone",  color: "#7a7f8a" },
      { id: TNT,         name: "TNT",    color: "#c94a3a" },
      { id: IGNITE_TOOL, name: "Ignite", color: "#ffb000" },
      { id: EMPTY,       name: "Erase",  color: "#05070b" },
    ];

    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    // Scale the canvas's display size to fit while preserving pixel resolution.
    function fitCanvas() {
      const stage = canvas.parentElement;
      const pad = 2;
      const maxW = stage.clientWidth - pad;
      const maxH = stage.clientHeight - pad;
      const scale = Math.max(1, Math.floor(Math.min(maxW / W, maxH / H)));
      canvas.style.width = (W * scale) + "px";
      canvas.style.height = (H * scale) + "px";
    }
    window.addEventListener("resize", fitCanvas);

    const grid = new Uint8Array(W * H);
    const meta = new Uint8Array(W * H); // per-cell state (TNT fuse countdown)
    const img = ctx.createImageData(W, H);

    const COLORS = {
      [EMPTY]:   [5, 7, 11, 255],
      [SAND]:    [217, 178, 106, 255],
      [WATER]:   [58, 141, 222, 255],
      [STONE]:   [122, 127, 138, 255],
      [TNT]:     [201, 74, 58, 255],
      [TNT_LIT]: [255, 200, 60, 255],
    };

    const FUSE_FRAMES = 30;
    const EXPLOSION_RADIUS = 10;

    const idx = (x, y) => y * W + x;
    const inBounds = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

    function swap(a, b) {
      const t = grid[a];
      grid[a] = grid[b];
      grid[b] = t;
      const mt = meta[a];
      meta[a] = meta[b];
      meta[b] = mt;
    }

    function explode(cx, cy) {
      const r = EXPLOSION_RADIUS;
      const r2 = r * r;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 > r2) continue;
          const x = cx + dx, y = cy + dy;
          if (!inBounds(x, y)) continue;
          const i = idx(x, y);
          const m = grid[i];
          // Chain-ignite TNT at the edge of the blast so it cascades.
          if (m === TNT && d2 > (r - 2) * (r - 2)) {
            grid[i] = TNT_LIT;
            meta[i] = 4 + ((Math.random() * 8) | 0);
            continue;
          }
          // Everything else in the blast radius is obliterated.
          grid[i] = EMPTY;
          meta[i] = 0;
        }
      }
    }

    // Single simulation step. Iterate bottom-up so gravity propagates in one pass.
    // Alternate horizontal scan direction each row to avoid left/right bias.
    function step() {
      for (let y = H - 1; y >= 0; y--) {
        const leftToRight = (y & 1) === 0;
        for (let k = 0; k < W; k++) {
          const x = leftToRight ? k : (W - 1 - k);
          const i = idx(x, y);
          const m = grid[i];
          if (m === EMPTY || m === STONE) continue;

          if (m === TNT_LIT) {
            let fuse = meta[i];
            if (fuse <= 1) {
              explode(x, y);
              continue;
            }
            meta[i] = fuse - 1;
            // Lit TNT still falls like sand.
            if (y + 1 < H) {
              const below = grid[idx(x, y + 1)];
              if (below === EMPTY || below === WATER) {
                swap(i, idx(x, y + 1));
                continue;
              }
              const dir = Math.random() < 0.5 ? -1 : 1;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= W) continue;
                const d = grid[idx(nx, y + 1)];
                if (d === EMPTY || d === WATER) {
                  swap(i, idx(nx, y + 1));
                  break;
                }
              }
            }
            continue;
          }

          if (m === TNT) {
            // Falls like sand.
            if (y + 1 < H) {
              const below = grid[idx(x, y + 1)];
              if (below === EMPTY || below === WATER) {
                swap(i, idx(x, y + 1));
                continue;
              }
              const dir = Math.random() < 0.5 ? -1 : 1;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= W) continue;
                const d = grid[idx(nx, y + 1)];
                if (d === EMPTY || d === WATER) {
                  swap(i, idx(nx, y + 1));
                  break;
                }
              }
            }
            continue;
          }

          if (m === SAND) {
            // Fall straight
            if (y + 1 < H) {
              const below = grid[idx(x, y + 1)];
              if (below === EMPTY || below === WATER) {
                swap(i, idx(x, y + 1));
                continue;
              }
              // Fall diagonally
              const dir = Math.random() < 0.5 ? -1 : 1;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= W) continue;
                const d = grid[idx(nx, y + 1)];
                if (d === EMPTY || d === WATER) {
                  swap(i, idx(nx, y + 1));
                  break;
                }
              }
            }
          } else if (m === WATER) {
            // Fall straight
            if (y + 1 < H && grid[idx(x, y + 1)] === EMPTY) {
              swap(i, idx(x, y + 1));
              continue;
            }
            // Diagonally down
            if (y + 1 < H) {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let moved = false;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= W) continue;
                if (grid[idx(nx, y + 1)] === EMPTY) {
                  swap(i, idx(nx, y + 1));
                  moved = true;
                  break;
                }
              }
              if (moved) continue;
            }
            // Flow sideways
            const dir = Math.random() < 0.5 ? -1 : 1;
            for (const dx of [dir, -dir]) {
              const nx = x + dx;
              if (nx < 0 || nx >= W) continue;
              if (grid[idx(nx, y)] === EMPTY) {
                swap(i, idx(nx, y));
                break;
              }
            }
          }
        }
      }
    }

    function render() {
      const data = img.data;
      // Flash lit TNT between yellow-hot and red based on a shared time phase
      // so chain-ignited blocks all pulse in sync — reads as "about to blow."
      const phase = (performance.now() * 0.02) | 0;
      for (let i = 0; i < grid.length; i++) {
        const g = grid[i];
        const p = i * 4;
        if (g === TNT_LIT) {
          const hot = (phase & 1) === 0;
          data[p]     = hot ? 255 : 240;
          data[p + 1] = hot ? 220 : 90;
          data[p + 2] = hot ? 90  : 40;
          data[p + 3] = 255;
        } else {
          const c = COLORS[g];
          data[p]     = c[0];
          data[p + 1] = c[1];
          data[p + 2] = c[2];
          data[p + 3] = c[3];
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // --- Input ---
    let currentMaterial = SAND;
    let brushSize = 5;
    let painting = false;
    let eraseMode = false;
    let lastPaint = null;

    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (W / rect.width);
      const cy = (e.clientY - rect.top)  * (H / rect.height);
      return [Math.floor(cx), Math.floor(cy)];
    }

    function paintAt(x, y, material) {
      const r = brushSize;
      const r2 = r * r;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r2) continue;
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const ci = idx(nx, ny);
          // Ignite tool: light any TNT cell under the brush.
          if (material === IGNITE_TOOL) {
            if (grid[ci] === TNT) {
              grid[ci] = TNT_LIT;
              meta[ci] = FUSE_FRAMES;
            }
            continue;
          }
          if (material === EMPTY) {
            grid[ci] = EMPTY;
            meta[ci] = 0;
          } else {
            if (material === STONE || material === TNT || grid[ci] === EMPTY || Math.random() < 0.7) {
              grid[ci] = material;
              meta[ci] = 0;
            }
          }
        }
      }
    }

    function paintLine(x0, y0, x1, y1, material) {
      const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1;
      const sy = y0 < y1 ? 1 : -1;
      let err = dx - dy;
      let x = x0, y = y0;
      while (true) {
        paintAt(x, y, material);
        if (x === x1 && y === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x += sx; }
        if (e2 < dx)  { err += dx; y += sy; }
      }
    }

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      painting = true;
      eraseMode = e.button === 2;
      const [x, y] = canvasCoords(e);
      lastPaint = [x, y];
      paintAt(x, y, eraseMode ? EMPTY : currentMaterial);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!painting) return;
      const [x, y] = canvasCoords(e);
      const mat = eraseMode ? EMPTY : currentMaterial;
      if (lastPaint) {
        paintLine(lastPaint[0], lastPaint[1], x, y, mat);
      } else {
        paintAt(x, y, mat);
      }
      lastPaint = [x, y];
    });

    function endPaint() {
      painting = false;
      eraseMode = false;
      lastPaint = null;
    }
    canvas.addEventListener("pointerup", endPaint);
    canvas.addEventListener("pointercancel", endPaint);
    canvas.addEventListener("pointerleave", () => { lastPaint = null; });

    // --- UI ---
    const matsEl = document.getElementById("materials");
    MATERIALS.forEach((m) => {
      const btn = document.createElement("button");
      btn.className = "mat" + (m.id === currentMaterial ? " active" : "");
      btn.dataset.id = m.id;
      btn.innerHTML = `<span class="swatch" style="background:${m.color}"></span>${m.name}`;
      btn.addEventListener("click", () => {
        currentMaterial = m.id;
        matsEl.querySelectorAll(".mat").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
      });
      matsEl.appendChild(btn);
    });

    const brushEl = document.getElementById("brush");
    const brushVal = document.getElementById("brushValue");
    brushEl.addEventListener("input", () => {
      brushSize = parseInt(brushEl.value, 10);
      brushVal.textContent = String(brushSize);
    });

    document.getElementById("clear").addEventListener("click", () => {
      grid.fill(EMPTY);
      meta.fill(0);
    });

    // --- Main loop ---
    function loop() {
      step();
      render();
      requestAnimationFrame(loop);
    }

    fitCanvas();
    // Fit again on next tick so layout has settled.
    requestAnimationFrame(fitCanvas);
    render();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
